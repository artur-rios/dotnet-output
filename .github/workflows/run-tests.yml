name: Run Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Test run from GitHub UI'

permissions:
  contents: read

concurrency:
  group: run-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/ArturRios.Output.sln

      - name: Check formatting
        run: dotnet format src/ArturRios.Output.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build src/ArturRios.Output.sln --configuration Release --no-restore

      # CI runs one job per Category trait, so a test without one would run in
      # none of them. List the tests outside every category and fail on any.
      - name: Check every test has a category
        run: |
          set -euo pipefail
          uncategorized=$(dotnet test src/ArturRios.Output.sln --configuration Release --no-build --list-tests \
            --filter "Category!=Unit&Category!=Functional" | sed -n 's/^    //p')
          if [ -n "$uncategorized" ]; then
            echo "::error::These tests have no Category trait (Unit or Functional), so no CI job runs them:"
            echo "$uncategorized"
            exit 1
          fi

      - name: Run unit tests
        run: >-
          dotnet test src/ArturRios.Output.sln --configuration Release --no-build
          --filter "Category=Unit"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory artifacts/test-results/unit

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: artifacts/test-results/unit
          if-no-files-found: ignore

  functional-tests:
    name: Functional tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/ArturRios.Output.sln

      - name: Build
        run: dotnet build src/ArturRios.Output.sln --configuration Release --no-restore

      - name: Run functional tests
        run: >-
          dotnet test src/ArturRios.Output.sln --configuration Release --no-build
          --filter "Category=Functional"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=functional-tests.trx"
          --results-directory artifacts/test-results/functional

      - name: Upload functional test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: functional-test-results
          path: artifacts/test-results/functional
          if-no-files-found: ignore
